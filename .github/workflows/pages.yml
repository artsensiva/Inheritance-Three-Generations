name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build landing page and free demo
        run: npm run build:site
        env:
          # Optional repository variables (Settings → Secrets and variables → Actions → Variables).
          # Public values only; see docs/ANALYTICS.md. Unset = no analytics.
          ANALYTICS_SCRIPT_SRC: ${{ vars.ANALYTICS_SCRIPT_SRC }}
          ANALYTICS_ATTRS: ${{ vars.ANALYTICS_ATTRS }}
          VITE_WISHLIST_URL: ${{ vars.WISHLIST_URL }}
          # Optional buy flow (Stripe Payment Link); see docs/PAYMENTS.md. Unset = no buy button, no legal pages.
          # With PAYMENT_LINK_URL set, the build fails until LEGAL_DETAILS and the price are complete.
          # Public address, for canonical links and sitemap.xml (set the SITE_URL variable if you use a custom domain).
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          PAYMENT_LINK_URL: ${{ vars.PAYMENT_LINK_URL }}
          PRICE_LABEL: ${{ vars.PRICE_LABEL }}
          DOWNLOAD_URL: ${{ vars.DOWNLOAD_URL }}
          # LEGAL_DETAILS alone adds Impressum and privacy pages (needed in Germany even without payments).
          LEGAL_DETAILS: ${{ vars.LEGAL_DETAILS }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
