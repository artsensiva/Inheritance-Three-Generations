name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Build demo and landing site
        run: npm run build:site
      - name: Content simulation (smoke)
        run: npx tsx scripts/simulate.ts 15
      - name: Static option-dominance check
        run: npx tsx scripts/dominance.ts
